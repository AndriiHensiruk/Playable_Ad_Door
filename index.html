<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Playable_Ad_Door</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 100vw;
      height: 177.77vw;
      max-height: 100vh;
      max-width: 56.25vh;
      background: #000;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }

    .bg-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .overlay-dark {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.25);
      z-index: 2;
    }

    /* Двері */
    #door-container {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      z-index: 3;
      transform: translateX(30%); 
      touch-action: none;
    }

    .door-img {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background-image: url('assets/door.webp');
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    .door-stroke-img {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 100%;
      background-image: url('assets/door_stroke.png');
      background-size: cover;
      background-position: center;
      z-index: 2;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
      pointer-events: none;
    }

    .stroke-active {
      opacity: 1;
      animation: strokePulse 1s infinite alternate ease-in-out;
    }

    @keyframes strokePulse {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }

    #step-1-ui {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .top-text-img {
      width: 85%;
      max-width: 320px;
      height: auto;
    }

    .bottom-text-img {
      width: 65%;
      max-width: 240px;
      height: auto;
    }

    .splash-arrow-img {
      width: 50px;
      height: 50px;
      margin: 15px 0;
      animation: bounceArrow 0.8s ease-in-out infinite alternate;
    }

    @keyframes bounceArrow {
      0% { transform: translateY(-8px); }
      100% { transform: translateY(8px); }
    }

    .hint-container {
      display: none;
      flex-direction: column;
      align-items: center;
      position: absolute;
      top: 25%;
    }

    .open-door-img {
      width: 75%;
      max-width: 280px;
      height: auto;
      transition: opacity 0.25s ease-in-out;
    }

    .hand-icon {
      width: 60px;
      height: 60px;
      margin-top: 50%;
      background-image: url('assets/hand.png');
      background-size: contain;
      background-repeat: no-repeat;
      animation: handSwipe 1.5s infinite;
      transition: opacity 0.25s ease-in-out;
    }

    @keyframes handSwipe {
      0% { transform: translateX(0); opacity: 0.8; }
      50% { transform: translateX(50px); opacity: 1; }
      100% { transform: translateX(100px); opacity: 0; }
    }

    .fade-out {
      opacity: 0 !important;
      pointer-events: none;
    }

    /* Фінальний контейнер */
    #final-cta-container {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 6;
      background: rgba(0, 0, 0, 0); 
      transition: background 0.6s ease-in-out; 
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: auto;
      gap: 20px;
    }

    #final-cta-container.darkened {
      background: rgba(0, 0, 0, 0.65);
    }

    .bubble-img {
      position: absolute;
      width: 38%;
      max-width: 210px;
      height: auto;
      opacity: 0;
      transform: scale(0.3);
      pointer-events: none;
      left: 15%;
      top: 50%;
      z-index: 6; 
      transition: filter 0.6s ease-in-out;
    }

    #final-cta-container.darkened .bubble-img {
      filter: brightness(0.5);
    }

    .bubble-appear {
      animation: bubblePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1) forwards;
    }

    @keyframes bubblePop {
      0% {
        opacity: 0;
        transform: scale(0.3) translateY(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .cta-btn-img {
      position: absolute;
      width: 90%;
      max-width: 350px;
      height: auto;
      cursor: pointer;
      opacity: 0;
      left: 5%;
      top: 37%;
      transform: translate(-50%, -50%) scale(0.8);
      z-index: 8; 
    }
    .cta-appear {
      animation: ctaPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards,
                 pulseCTA 0.9s infinite alternate 0.5s;
    }

    @keyframes ctaPop {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes pulseCTA {
      0% { transform: scale(0.95); }
      100% { transform: scale(1.05); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <audio id="bg-music" src="assets/bg_music.mp3" loop preload="auto"></audio>
  <audio id="door-sound" src="assets/door_open.mp3" loop preload="auto"></audio>

  <div id="game-container">
    <video id="bg-video" class="bg-video" loop playsinline webkit-playsinline muted preload="auto">
      <source src="assets/video.mp4" type="video/mp4">
      <source src="assets/video.webm" type="video/webm">
    </video>

    <div class="overlay-dark"></div>

    <div id="door-container">
      <div id="door-img" class="door-img"></div>
      <div id="door-stroke" class="door-stroke-img"></div>
    </div>

    <div class="ui-layer">
      <div id="step-1-ui">
        <img src="assets/top_text.png" alt="See What Others Don't" class="top-text-img">
        <img src="assets/arrow.png" alt="Arrow" class="splash-arrow-img">
        <img src="assets/tap_here.png" alt="Tap Here" class="bottom-text-img">
      </div>

      <div id="step-2-ui" class="hint-container">
        <img id="open-door-text" src="assets/open_door_text.png" alt="Open The Door" class="open-door-img">
        <div id="hand-icon" class="hand-icon"></div>
      </div>
    </div>

    <div id="final-cta-container">
      <img id="bubble-img" src="assets/bubble.png" alt="Bubble" class="bubble-img">
      <img id="cta-btn" src="assets/cta_button.png" alt="Play Now" class="cta-btn-img">
    </div>
  </div>

  <script>
    const step1UI = document.getElementById('step-1-ui');
    const step2UI = document.getElementById('step-2-ui');
    const openDoorText = document.getElementById('open-door-text');
    const handIcon = document.getElementById('hand-icon');
    
    const finalCTA = document.getElementById('final-cta-container');
    const bubbleImg = document.getElementById('bubble-img');
    const ctaBtn = document.getElementById('cta-btn');
    
    const doorContainer = document.getElementById('door-container');
    const doorStroke = document.getElementById('door-stroke');
    const gameContainer = document.getElementById('game-container');
    const bgVideo = document.getElementById('bg-video');

    const bgMusic = document.getElementById('bg-music');
    const doorSound = document.getElementById('door-sound');

    let currentStep = 1;
    let isDragging = false;
    let startX = 0;
    let baseTranslatePercent = 30; 
    let currentDoorTranslatePercent = 30;
    let containerWidth = gameContainer.clientWidth;

    bgVideo.pause();

    function warmUpAudio() {
      doorSound.muted = false;
      doorSound.play().then(() => {
        doorSound.pause();
        doorSound.currentTime = 0;
      }).catch(() => {});

      bgMusic.muted = false;
      bgMusic.play().catch(() => {});
    }

    step1UI.addEventListener('click', () => {
      if (currentStep !== 1) return;
      currentStep = 2;

      bgVideo.muted = true;
      bgVideo.load();
      bgVideo.play().catch((err) => {
        console.warn('Video playback failed:', err);
      });

      warmUpAudio();

      step1UI.classList.add('hidden');
      step2UI.style.display = 'flex';

      doorStroke.classList.add('stroke-active');
      doorContainer.style.cursor = 'grab';

      initDragEvents();
    });

    function initDragEvents() {
      doorContainer.addEventListener('mousedown', startDrag);
      window.addEventListener('mousemove', onDrag);
      window.addEventListener('mouseup', stopDrag);

      doorContainer.addEventListener('touchstart', startDrag, { passive: false });
      window.addEventListener('touchmove', onDrag, { passive: false });
      window.addEventListener('touchend', stopDrag);
    }

    function getClientX(e) {
      return e.touches ? e.touches[0].clientX : e.clientX;
    }

    function startDrag(e) {
      if (currentStep !== 2) return;
      isDragging = true;
      startX = getClientX(e);
      containerWidth = gameContainer.clientWidth;
      
      doorStroke.classList.add('fade-out');
      handIcon.classList.add('fade-out');
      openDoorText.classList.add('fade-out');

      doorSound.currentTime = 0;
      doorSound.play().catch(() => {});
    }

    function onDrag(e) {
      if (!isDragging || currentStep !== 2) return;
      e.preventDefault();

      const currentX = getClientX(e);
      const deltaX = currentX - startX;
      
      let newPercent = baseTranslatePercent + (deltaX / containerWidth) * 100;

      if (newPercent < baseTranslatePercent) newPercent = baseTranslatePercent;

      currentDoorTranslatePercent = newPercent;
      doorContainer.style.transform = `translateX(${newPercent}%)`;

      if (newPercent >= 90) {
        completeDoorOpening();
      }
    }

    function stopDrag() {
      if (!isDragging) return;
      isDragging = false;

      doorSound.pause();
      doorSound.currentTime = 0;

      if (currentStep === 2 && currentDoorTranslatePercent < 90) {
        let targetPercent = baseTranslatePercent + (currentDoorTranslatePercent - baseTranslatePercent) * 0.4;
        baseTranslatePercent = Math.min(targetPercent, 75);

        doorContainer.style.transition = 'transform 0.4s ease-out';
        doorContainer.style.transform = `translateX(${baseTranslatePercent}%)`;
        currentDoorTranslatePercent = baseTranslatePercent;

        setTimeout(() => {
          doorContainer.style.transition = 'none';
          doorStroke.classList.remove('fade-out');
          handIcon.classList.remove('fade-out');
        }, 400);
      }
    }

    function completeDoorOpening() {
      currentStep = 3;
      isDragging = false;

      doorSound.pause();
      doorSound.currentTime = 0;

      doorContainer.style.transition = 'transform 0.3s ease-out';
      doorContainer.style.transform = 'translateX(100%)';

      doorStroke.classList.remove('stroke-active');
      step2UI.classList.add('hidden');

      setTimeout(() => {
        finalCTA.style.display = 'flex';
        
        bubbleImg.classList.add('bubble-appear');

        setTimeout(() => {
          finalCTA.classList.add('darkened');
          ctaBtn.classList.add('cta-appear');
        }, 900);

      }, 300);
    }

    ctaBtn.addEventListener('click', () => {
      window.open('https://hanimax.com/serials/show-me-how/1', '_self');
    });
  </script>
</body>
</html>
